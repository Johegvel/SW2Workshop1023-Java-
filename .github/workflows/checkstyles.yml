name: Java Code Standards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Checkstyle
        run: |
          curl -sSL -o checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.5/checkstyle-10.12.5-all.jar

      - name: Run Checkstyle
        run: |
          # Usa checkstyle.xml del repo si existe; si no, usa la configuración Google incluida en el jar
          if [ -f checkstyle.xml ]; then
            CONFIG=checkstyle.xml
          else
            CONFIG=/google_checks.xml
          fi

          FILES=$(find . -name "*.java" -not -path "./.git/*")
          java -jar checkstyle.jar -c "$CONFIG" -f xml -o checkstyle-report.xml $FILES

          # Google checks usa severidad "warning", así que el exit code no basta: falla si hay cualquier <error>
          if grep -q "<error" checkstyle-report.xml; then
            echo "Se encontraron violaciones de estilo:"
            grep -c "<error" checkstyle-report.xml
            exit 1
          fi
          echo "Sin violaciones de estilo."

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: checkstyle-report.xml